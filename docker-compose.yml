version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sigcontrol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigcontrol}
      POSTGRES_USER: ${POSTGRES_USER:-sigcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigcontrolpass}
    ports:
      - "5432:5432"
    volumes:
      - sigcontrol_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigcontrol} -d ${POSTGRES_DB:-sigcontrol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: sigcontrol_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALG: ${JWT_ALG:-HS256}
      ACCESS_TOKEN_EXPIRE_MIN: ${ACCESS_TOKEN_EXPIRE_MIN:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  sigcontrol_pgdata: