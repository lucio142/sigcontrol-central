<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>SigControl - Login</title>
</head>
<body class="bg-light">
<div class="container py-5" style="max-width:420px;">
  <div class="card shadow-sm">
    <div class="card-body">
      <h4 class="mb-3">SigControl Central</h4>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="email" class="form-control" autocomplete="username">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password">
      </div>

      <button class="btn btn-primary w-100" onclick="doLogin()">Entrar</button>
      <div id="msg" class="text-danger small mt-3"></div>
    </div>
  </div>
</div>

<script>
async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  const r = await fetch('/api/auth/login', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password})
  });

  if(!r.ok){
    document.getElementById('msg').innerText = 'Credenciales inválidas';
    return;
  }
  const data = await r.json();
  sessionStorage.setItem('token', data.access_token);
  window.location.href = '/dashboard';
}
</script>
</body>
</html>
