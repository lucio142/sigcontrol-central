<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<title>SigControl - Mapa 3D</title>

<style>
:root{
--hc-blue:#0b5ed7;
--hc-green:#16a34a;
--hc-bg:#07101f;
--hc-panel: rgba(10,18,35,.82);
--hc-border: rgba(148,163,184,.22);
--hc-text:#e2e8f0;
--hc-muted:#94a3b8;
}

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:var(--hc-bg);
overflow:hidden;
}

.hc-nav{
background: linear-gradient(90deg, var(--hc-blue), var(--hc-green));
}

#stage{
position:relative;
width:100%;
height:calc(100dvh - 56px);
min-height:300px;
}

canvas{
display:block;
width:100% !important;
height:100% !important;
}

.panel{
background: var(--hc-panel);
border: 1px solid var(--hc-border);
color: var(--hc-text);
border-radius: 16px;
box-shadow: 0 18px 50px rgba(0,0,0,.45);
padding: 12px;
backdrop-filter: blur(10px);
}

.muted{
color:var(--hc-muted);
font-size:.85rem;
}

.hud{
position:absolute;
top:14px;
left:14px;
z-index:10;
width:360px;
max-width:90vw;
}

.right{
position:absolute;
top:14px;
right:14px;
z-index:10;
width:420px;
max-width:90vw;
}

#err{
margin-top:10px;
color:#fbbf24;
font-size:.9rem;
white-space:pre-wrap;
}

#dbg{
position:absolute;
left:14px;
bottom:14px;
z-index:11;
background:rgba(0,0,0,.35);
border:1px solid rgba(148,163,184,.22);
color:#e2e8f0;
padding:8px 10px;
border-radius:12px;
font:12px ui-monospace,monospace;
backdrop-filter:blur(8px);
max-width:min(780px,calc(100% - 28px));
white-space:pre-wrap;
}

.legend{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:8px;
}

.legend-item{
display:flex;
align-items:center;
gap:5px;
font-size:.78rem;
color:var(--hc-muted);
}

.legend-dot{
width:10px;
height:10px;
border-radius:50%;
}

#stage.placing{
cursor:crosshair !important;
}

#place_banner{
display:none;
position:absolute;
bottom:60px;
left:50%;
transform:translateX(-50%);
z-index:20;
background:#0b5ed7;
color:#fff;
padding:10px 22px;
border-radius:12px;
font-size:.95rem;
font-weight:600;
box-shadow:0 4px 20px rgba(0,0,0,.5);
pointer-events:none;
}

@media (max-width:900px){

.hud{
width:90vw;
left:5vw;
}

.right{
width:90vw;
right:5vw;
top:auto;
bottom:10px;
}

}
</style>
</head>

<body>

<nav class="navbar navbar-dark hc-nav px-3">
<span class="navbar-brand fw-semibold">SigControl Central - Mapa 3D</span>
<div class="d-flex gap-2">
<a class="btn btn-outline-light btn-sm" href="/dashboard">Dashboard</a>
</div>
</nav>

<div id="stage">

<div id="place_banner">📍 Haz click en el mapa para colocar la puerta</div>

<div class="hud">
<div class="panel">
<div class="d-flex justify-content-between align-items-start">
<div>
<div class="fw-semibold">Control</div>
<div class="muted">Rotar · Zoom · Click para seleccionar</div>
</div>
<span id="role_badge" class="badge" style="background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);">...</span>
</div>

<div class="d-flex gap-2 mt-2">
<button class="btn btn-sm btn-outline-light" id="btn_reset">Reset vista</button>
<button class="btn btn-sm btn-outline-light" id="btn_reload">Recargar</button>
</div>

<div class="muted mt-2">Tip: <b>G</b> = Grid · <b>D</b> = Puertas · <b>Esc</b> = Cancelar</div>

<div id="place_box" style="display:none; margin-top:10px; border-top:1px solid var(--hc-border); padding-top:10px;">
<div class="muted mb-1">Posicionar puerta en el mapa:</div>
<select id="place_door_sel" class="form-select form-select-sm mb-2"></select>
<button class="btn btn-sm btn-primary w-100" id="btn_start_place">
📍 Activar modo posicionamiento
</button>
</div>

</div>
</div>

<div class="right">
<div class="panel">
<div class="fw-semibold">Selección</div>
<div id="sel_sub" class="muted">Nada seleccionado</div>
<div id="sel_body" class="muted mt-2">
Click sobre un edificio o puerta.
</div>
</div>
</div>

<div id="dbg">dbg: iniciando…</div>

</div>

<script type="importmap">
{
"imports": {
"three": "/static/vendor/three/build/three.module.js",
"three/addons/": "/static/vendor/three/addons/"
}
}
</script>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const stage = document.getElementById("stage");

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(stage.clientWidth,stage.clientHeight);

stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
35,
stage.clientWidth/stage.clientHeight,
0.01,
200
);

camera.position.set(9,10,9);

const controls = new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;

function resizeRenderer(){
const w=stage.clientWidth;
const h=stage.clientHeight;
renderer.setSize(w,h);
camera.aspect=w/h;
camera.updateProjectionMatrix();
}

window.addEventListener("resize",resizeRenderer);
window.addEventListener("orientationchange",resizeRenderer);

function animate(){
requestAnimationFrame(animate);
controls.update();
renderer.render(scene,camera);
}

animate();

</script>

</body>
</html>
